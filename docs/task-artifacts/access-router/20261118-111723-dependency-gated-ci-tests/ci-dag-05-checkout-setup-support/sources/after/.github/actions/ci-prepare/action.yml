name: CI build-output preparation
description: One clean full build and a verified same-run output-only archive
inputs:
  checkout-root:
    description: Verified real source root from the top-level checkout action
    required: true
  checkout-relative:
    description: Verified source path relative to the unchanged action workspace
    required: true
  pnpm-dest:
    description: Newly owned isolated pnpm self-installer destination
    required: true
outputs:
  artifact-name:
    description: Exact run/attempt/checkout-scoped build artifact
    value: ${{ steps.prepare.outputs.artifact-name }}
  artifact-digest:
    description: Expected archive SHA-256, passed outside the downloaded artifact
    value: ${{ steps.prepare.outputs.artifact-digest }}
runs:
  using: composite
  steps:
    - uses: ./.github/actions/ci-setup
      with:
        checkout-root: ${{ inputs.checkout-root }}
        checkout-relative: ${{ inputs.checkout-relative }}
        pnpm-dest: ${{ inputs.pnpm-dest }}
    - id: prepare
      shell: bash
      working-directory: ${{ inputs.checkout-root }}
      run: node scripts/ci-test-artifacts.mjs prepare
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: ${{ steps.prepare.outputs.artifact-name }}
        path: ${{ steps.prepare.outputs.artifact-path }}
        if-no-files-found: error
        compression-level: 0
