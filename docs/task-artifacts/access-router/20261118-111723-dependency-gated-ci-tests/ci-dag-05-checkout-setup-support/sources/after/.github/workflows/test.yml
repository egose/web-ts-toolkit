name: Test

on:
  pull_request:
    paths-ignore:
    - '**.md'
  push:
    paths-ignore:
    - '**.md'

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Setup Tools
      uses: ./.github/actions/setup-tools

    - name: Setup NPM packages
      uses: ./.github/actions/setup-npm

    - name: Run lint
      run: pnpm lint

  ci-validate:
    name: ci-validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - id: source
        uses: ./.github/actions/ci-checkout
      - uses: ./.github/actions/ci-setup
        with:
          checkout-root: ${{ steps.source.outputs.root }}
          checkout-relative: ${{ steps.source.outputs.relative-root }}
          pnpm-dest: ${{ steps.source.outputs.pnpm-dest }}
        env:
          TMPDIR: ${{ steps.source.outputs.tmpdir }}
      - run: pnpm test:groups:check
        working-directory: ${{ steps.source.outputs.root }}
        env:
          TMPDIR: ${{ steps.source.outputs.tmpdir }}
      - run: pnpm test:ci:check
        working-directory: ${{ steps.source.outputs.root }}
        env:
          TMPDIR: ${{ steps.source.outputs.tmpdir }}
  ci-prepare:
    name: ci-prepare
    runs-on: ubuntu-24.04
    needs:
      - ci-validate
    outputs:
      artifact-name: ${{ steps.prepare.outputs.artifact-name }}
      artifact-digest: ${{ steps.prepare.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - id: source
        uses: ./.github/actions/ci-checkout
      - id: prepare
        uses: ./.github/actions/ci-prepare
        with:
          checkout-root: ${{ steps.source.outputs.root }}
          checkout-relative: ${{ steps.source.outputs.relative-root }}
          pnpm-dest: ${{ steps.source.outputs.pnpm-dest }}
        env:
          TMPDIR: ${{ steps.source.outputs.tmpdir }}
  test-access-router:
    name: test-access-router
    runs-on: ubuntu-24.04
    needs:
      - ci-prepare
      - test-express-json-router
      - test-utils
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
