name: Setup NPM Packages
description: Setup required NPM packages with caching for pnpm
runs:
  using: composite
  steps:
  - name: Setup Tools
    uses: egose/actions/pnpm-packages@66a82313a99a4e502830eb48acc073aedcdbdce1
    with:
      frozen: 'true'
      ignore-scripts: 'true'
      paths: |
        .
        website
