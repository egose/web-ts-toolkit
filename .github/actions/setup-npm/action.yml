name: Setup NPM Packages
description: Setup required NPM packages with caching for pnpm
runs:
  using: composite
  steps:
  - name: Setup Tools
    uses: egose/actions/pnpm-packages@07bfea5b03e310822963a15dccc885c2d3385284
    with:
      frozen: 'true'
      ignore-scripts: 'true'
      paths: |
        .
        website
