name: Setup NPM Packages
description: Setup required NPM packages with caching for pnpm
runs:
  using: composite
  steps:
  - name: Setup Tools
    uses: egose/actions/pnpm-packages@dfe5d14c69e654ca87d9f6fc491084a59eed6181
    with:
      frozen: 'true'
      ignore-scripts: 'true'
      paths: |
        .
        website
