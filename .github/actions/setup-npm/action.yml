name: Setup NPM Packages
description: Setup required NPM packages with caching for pnpm
runs:
  using: composite
  steps:
  - name: Setup Tools
    uses: egose/actions/pnpm-packages@e15b9c2e3b42cc9ca49641cf6a428f7c7e503ae5
    with:
      frozen: 'true'
      ignore-scripts: 'true'
      paths: |
        .
        website
