name: Setup Tools
description: Setup required tools in the workspace

runs:
  using: composite
  steps:
  # asdf compiles Python from source; without these dev headers the stdlib
  # extensions (_bz2, readline, _lzma, etc.) silently fail to build.
  - name: Install python build dependencies
    run: |
      sudo apt-get update
      sudo apt-get install -y --no-install-recommends \
        build-essential \
        libbz2-dev \
        libffi-dev \
        liblzma-dev \
        libncursesw5-dev \
        libreadline-dev \
        libsqlite3-dev \
        libssl-dev \
        tk-dev \
        uuid-dev \
        zlib1g-dev
      sudo apt-get clean
    shell: bash

  - name: Setup Tools
    uses: egose/actions/asdf-tools@71efad841d4b7bb6a479984abacf7111ebd44a16
    with:
      github-token: ${{ github.token }}
      plugins: |
        docker-compose=https://github.com/egose/asdf-docker-compose.git

  - name: Install python tools
    run: |
      pip install -r requirements.txt
      asdf reshim
    shell: bash
