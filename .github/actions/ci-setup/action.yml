name: CI workspace setup
description: Pinned Node/pnpm and independently frozen-installed root workspace only
inputs:
  checkout-root:
    description: Verified real source root from the top-level checkout action
    required: true
  checkout-relative:
    description: Verified source path relative to the unchanged action workspace
    required: true
  pnpm-dest:
    description: Newly owned isolated pnpm self-installer destination
    required: true
runs:
  using: composite
  steps:
  - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
    with:
      node-version-file: ${{ inputs.checkout-relative }}/.tool-versions
      package-manager-cache: false
  - id: installer-boundary
    shell: bash
    working-directory: ${{ inputs.checkout-root }}
    run: node .github/actions/ci-checkout/index.mjs --check-install
  - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
    with:
      version: 11.24.0
      package_json_file: ${{ inputs.checkout-relative }}/package.json
      dest: ${{ inputs.pnpm-dest }}
      run_install: false
      cache: false
  - id: install
    shell: bash
    working-directory: ${{ inputs.checkout-root }}
    run: pnpm install --frozen-lockfile --ignore-scripts
  - id: tools
    shell: bash
    working-directory: ${{ inputs.checkout-root }}
    run: node scripts/ci-test-workspace.mjs setup
