name: Test

on:
  pull_request:
    paths-ignore:
    - '**.md'
  push:
    paths-ignore:
    - '**.md'

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Setup Tools
      uses: ./.github/actions/setup-tools

    - name: Setup NPM packages
      uses: ./.github/actions/setup-npm

    - name: Run lint
      run: pnpm lint

  unit-test:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Setup Tools
      uses: ./.github/actions/setup-tools

    - name: Setup NPM packages
      uses: ./.github/actions/setup-npm

    - name: Get Playwright version
      id: playwright-version
      working-directory: packages/pdf-reader
      run: |
        echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

    - name: Cache Playwright browsers
      id: pw-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}-chromium

    - name: Install Playwright Chromium
      if: steps.pw-cache.outputs.cache-hit != 'true'
      working-directory: packages/pdf-reader
      run: pnpm exec playwright install --with-deps chromium

    - name: Install Playwright system deps
      if: steps.pw-cache.outputs.cache-hit == 'true'
      working-directory: packages/pdf-reader
      run: pnpm exec playwright install-deps chromium

    - name: Run unit tests
      run: |
        pnpm build
        pnpm test

  access-router-minimum-node-smoke:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Pin minimum access-router Node version
      run: |
        printf 'nodejs 22.20.0\npython 3.14.6\npnpm 11.21.0\n' > .tool-versions

    - name: Setup Tools
      uses: ./.github/actions/setup-tools

    - name: Setup NPM packages
      uses: ./.github/actions/setup-npm

    - name: Run access-router packed consumer smoke
      run: |
        node --version
        pnpm --version
        pnpm --filter @web-ts-toolkit/access-router... build
        pnpm --filter @web-ts-toolkit/access-router exec vitest run --config vitest.config.ts test/packed-consumer-compatibility.test.ts --testNamePattern "supports minimum peers from release-artifact tarballs across ESM, CJS, NodeNext, and Bundler consumers"
