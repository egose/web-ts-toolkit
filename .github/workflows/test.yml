name: Test

on:
  pull_request:
    paths-ignore:
    - '**.md'
  push:
    paths-ignore:
    - '**.md'

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Setup Tools
      uses: ./.github/actions/setup-tools

    - name: Setup NPM packages
      uses: ./.github/actions/setup-npm

    - name: Run lint
      run: pnpm lint

  unit-test:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Setup Tools
      uses: ./.github/actions/setup-tools

    - name: Setup NPM packages
      uses: ./.github/actions/setup-npm

    - name: Get Playwright version
      id: playwright-version
      working-directory: packages/pdf-reader
      run: |
        echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

    - name: Cache Playwright browsers
      id: pw-cache
      uses: actions/cache@5a3c020925354a525fc2a9b5c2b7c93acdf4d9be
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}-chromium

    - name: Install Playwright Chromium
      if: steps.pw-cache.outputs.cache-hit != 'true'
      working-directory: packages/pdf-reader
      run: pnpm exec playwright install --with-deps chromium

    - name: Install Playwright system deps
      if: steps.pw-cache.outputs.cache-hit == 'true'
      working-directory: packages/pdf-reader
      run: pnpm exec playwright install-deps chromium

    - name: Run unit tests
      run: |
        pnpm build
        pnpm test
